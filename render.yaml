# Render Blueprint — Render Free, git-shipped read-only database snapshot.
# Deploying this (Render Dashboard → New → Blueprint, pointing at this repo)
# is a decision for you; nothing here runs anything until you connect and
# deploy it.
#
# PATTERN (matches the yashwantr93/crypto-intel project, already live on
# Render Free): the cloud service serves a READ-ONLY copy of whatever
# data_store/market.db and data_store/market_v2.db were most recently
# committed and pushed. Render Free has no persistent disk and sleeps on
# idle, so this deployment does not attempt to write data from the cloud at
# all — the two SQLite files are tracked in git and simply arrive with every
# `git checkout` the Render build performs, exactly like Crypto Intel's
# crypto_intel.db. Data collection (run_daily.py / run_daily_v2.py) stays on
# your local machine, same as it always has; "refreshing production data" is
# `git add data_store/*.db && git commit && git push` — see DEPLOYMENT.md.
#
# The in-process scheduler (scheduler.py) is explicitly disabled here
# (MID_ENABLE_SCHEDULER=0) — it has no job to do in this pattern, since the
# cloud instance never runs the pipelines itself.

services:
  - type: web
    name: tradepilot-ai
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MID_ENABLE_SCHEDULER
        value: "0"
